<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- 装饰性小星星（代表 Sprite 精灵） -->
  <g fill="url(#star)" opacity="0.9">
    <!-- 左上角小星星 -->
    <path d="M80 80 L84 90 L94 90 L86 96 L89 106 L80 100 L71 106 L74 96 L66 90 L76 90 Z"/>
    <!-- 右上角小星星 -->
    <path d="M432 72 L435 80 L443 80 L437 85 L439 93 L432 88 L425 93 L427 85 L421 80 L429 80 Z"/>
    <!-- 右中角小星星 -->
    <path d="M440 256 L443 263 L450 263 L444 267 L446 274 L440 270 L434 274 L436 267 L430 263 L437 263 Z"/>
    <!-- 左下角小星星 -->
    <path d="M72 380 L75 387 L82 387 L76 391 L78 398 L72 394 L66 398 L68 391 L62 387 L69 387 Z"/>
    <!-- 底部中间小星星 -->
    <path d="M256 440 L259 447 L266 447 L260 451 L262 458 L256 454 L250 458 L252 451 L246 447 L253 447 Z"/>
  </g>

  <!-- 悬浮卡片主体 -->
  <rect x="112" y="128" width="288" height="256" rx="24" fill="url(#card)" opacity="0.95"/>

  <!-- 卡片顶部栏 -->
  <rect x="112" y="128" width="288" height="48" rx="24" fill="#e5e7eb" opacity="0.8"/>
  <rect x="112" y="152" width="288" height="24" fill="#e5e7eb" opacity="0.8"/>

  <!-- 三个圆点（关闭/最小化/最大化） -->
  <circle cx="140" cy="152" r="6" fill="#ef4444"/>
  <circle cx="160" cy="152" r="6" fill="#f59e0b"/>
  <circle cx="180" cy="152" r="6" fill="#22c55e"/>

  <!-- ESN 文字（顶部栏右侧） -->
  <text x="340" y="157" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle" letter-spacing="1">ESN</text>

  <!-- 状态点 -->
  <circle cx="372" cy="152" r="5" fill="#22c55e"/>

  <!-- 内容区域：监控条 -->
  <rect x="136" y="200" width="100" height="12" rx="6" fill="#e5e7eb"/>
  <rect x="136" y="200" width="60" height="12" rx="6" fill="#6366f1"/>

  <rect x="136" y="224" width="100" height="12" rx="6" fill="#e5e7eb"/>
  <rect x="136" y="224" width="45" height="12" rx="6" fill="#8b5cf6"/>

  <!-- 番茄钟圆环 -->
  <circle cx="340" cy="220" r="28" fill="none" stroke="#e5e7eb" stroke-width="6"/>
  <circle cx="340" cy="220" r="28" fill="none" stroke="#f87171" stroke-width="6" stroke-dasharray="132 44" stroke-linecap="round" transform="rotate(-90 340 220)"/>
  <text x="340" y="226" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">25</text>

  <!-- 底部按钮 -->
  <rect x="136" y="280" width="64" height="32" rx="8" fill="#6366f1" opacity="0.9"/>
  <rect x="208" y="280" width="64" height="32" rx="8" fill="#e5e7eb"/>
  <rect x="280" y="280" width="64" height="32" rx="8" fill="#e5e7eb"/>

  <!-- Sprite 文字（卡片底部） -->
  <text x="256" y="345" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6366f1" text-anchor="middle" letter-spacing="2">SPRITE</text>

  <!-- 悬浮阴影效果 -->
  <ellipse cx="256" cy="410" rx="140" ry="12" fill="#000000" opacity="0.15"/>
</svg>
